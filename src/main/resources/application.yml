spring:
  application:
    name: destore-prototype
  jackson:
    serialization:
      INDENT_OUTPUT: true
  profiles:
    active: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/destore
    driver-class-name: org.postgresql.Driver
    username: destore
    password: destore
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info

destore:
  kafka:
    enabled: false
    topic: stock-low

---
spring:
  config:
    activate:
      on-profile: pricing
  application:
    name: pricing-service
server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: inventory
  application:
    name: inventory-service
server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: loyalty
  application:
    name: loyalty-service
server:
  port: 8083

---
spring:
  config:
    activate:
      on-profile: finance
  application:
    name: finance-service
server:
  port: 8084

---
spring:
  config:
    activate:
      on-profile: reporting
  application:
    name: reporting-service
server:
  port: 8085

---
spring:
  config:
    activate:
      on-profile: notifications
  application:
    name: notification-service
server:
  port: 8086

---
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: stock-low
    listener:
      missing-topics-fatal: false
    consumer:
      group-id: destore-notifications
      auto-offset-reset: earliest
destore:
  kafka:
    enabled: true
    topic: stock-low
  gateway:
    pricing: http://localhost:8087
    inventory: http://localhost:8087
    loyalty: http://localhost:8087
    finance: http://localhost:8087
    notifications: http://localhost:8087
    reporting: http://localhost:8087
